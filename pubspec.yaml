name: agenda_compartilhada
description: Interface navegavel da agenda compartilhada com os cinco temas originais.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  app_links: ^7.2.2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.0
  table_calendar: ^3.1.3
  timezone: ^0.10.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Ícone do app (Android). Troque os PNGs em assets/icon/ e rode:
#   flutter pub get
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFF4E6"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # Android 13+ (ícone temático): crie o arquivo e descomente.
  # adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"